services:
  db:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${DB_HOST_PORT:-55432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-kaloriekassen}
      POSTGRES_USER: ${DB_USER:-kalorie}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD skal sættes i .env}
      TZ: ${SCHEDULER_TIMEZONE:-Europe/Copenhagen}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  scheduler:
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      GOOGLE_OAUTH_INTERACTIVE: "false"
      GOOGLE_CLIENT_SECRETS_PATH: /app/secrets/google_api_client_secrets.json
      GOOGLE_TOKEN_STORE_PATH: /app/secrets/google_oauth_token.json
      WITHINGS_CLIENT_SECRETS_PATH: /app/secrets/withings_api_client.json
      WITHINGS_TOKEN_STORE_PATH: /app/secrets/withings_oauth_token.json
      OAUTH_UPLOAD_TO_NAS: "false"
      TZ: ${SCHEDULER_TIMEZONE:-Europe/Copenhagen}
    volumes:
      - ${SECRETS_DIR:-./secrets}:/app/secrets
    command: ["kaloriekassen", "scheduler"]
    stop_grace_period: 30s

  web:
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      TZ: ${SCHEDULER_TIMEZONE:-Europe/Copenhagen}
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8088}:8000"
    command:
      - uvicorn
      - kaloriekassen.web.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 15s

volumes:
  postgres_data:
