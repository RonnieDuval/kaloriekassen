services:
  sync:
    build: .
    env_file: .env
    environment:
      DB_TYPE: sqlite
      SQLITE_DB_PATH: /data/kaloriekassen.db
    command: ["kaloriekassen", "intervals", "google-health-export", "google-health-read"]
    volumes:
      - kaloriekassen_data:/data
    restart: "no"

volumes:
  kaloriekassen_data:
