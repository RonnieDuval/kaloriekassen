services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-kaloriekassen}
      POSTGRES_USER: ${DB_USER:-kalorie}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kalorie}
      TZ: ${SCHEDULER_TIMEZONE:-Europe/Copenhagen}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  scheduler:
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      GOOGLE_OAUTH_INTERACTIVE: "false"
      TZ: ${SCHEDULER_TIMEZONE:-Europe/Copenhagen}
    volumes:
      - ./secrets:/app/secrets
    command: ["kaloriekassen", "scheduler"]
    stop_grace_period: 30s

volumes:
  postgres_data:
