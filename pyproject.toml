[project]
name = "kaloriekassen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-auth>=2.40.0",
    "google-auth-oauthlib>=1.4.0",
    "lxml>=5.4.0",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.2",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project.scripts]
kaloriekassen = "kaloriekassen.cli:main"

[tool.pytest.ini_options]
markers = [
    "integration: tests that call external services",
]
