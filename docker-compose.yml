services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-kaloriekassen}
      POSTGRES_USER: ${DB_USER:-kalorie}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kalorie}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  sync_intervals:
    build: .
    command: ["python", "run_sync.py", "intervals"]
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DB_HOST: db
    restart: "no"

  sync_myfitnesspal:
    build: .
    command: ["python", "run_sync.py", "myfitnesspal"]
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DB_HOST: db
    volumes:
      - ${HOME}/.config/google-chrome:/root/.config/google-chrome:ro
      - ./temp_chrome_profile:/app/temp_chrome_profile
    restart: "no"

  sync_scheduler:
    build: .
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DB_HOST: db
      SYNC_TARGETS: ${SYNC_TARGETS:-intervals myfitnesspal fitbit google-health}
      SYNC_DAYS: ${SYNC_DAYS:-7}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-21600}
    command:
      - /bin/bash
      - -lc
      - |
        set -e
        while true; do
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Running sync: $SYNC_TARGETS (days=$SYNC_DAYS)"
          python run_sync.py $SYNC_TARGETS --days "$SYNC_DAYS"
          echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] Sleeping $SYNC_INTERVAL_SECONDS seconds"
          sleep "$SYNC_INTERVAL_SECONDS"
        done
    volumes:
      - ${HOME}/.config/google-chrome:/root/.config/google-chrome:ro
      - ./temp_chrome_profile:/app/temp_chrome_profile
    restart: unless-stopped


volumes:
  pgdata:
