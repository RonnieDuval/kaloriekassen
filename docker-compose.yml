services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-kaloriekassen}
      POSTGRES_USER: ${DB_USER:-kalorie}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kalorie}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  sync:
    build: .
    depends_on:
      - db
    env_file: .env
    environment:
      DB_HOST: db
    command: ["kaloriekassen", "intervals", "google-health-export", "google-health-read"]
    restart: "no"

volumes:
  postgres_data:
