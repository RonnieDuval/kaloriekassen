services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-kaloriekassen}
      POSTGRES_USER: ${DB_USER:-kalorie}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kalorie}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  sync_intervals:
    build: .
    command: ["python", "run_sync.py", "intervals"]
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DB_HOST: db
    restart: "no"

  sync_myfitnesspal:
    build: .
    command: ["python", "run_sync.py", "myfitnesspal"]
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DB_HOST: db
    volumes:
      - ${HOME}/.config/google-chrome:/root/.config/google-chrome:ro
      - ./temp_chrome_profile:/app/temp_chrome_profile
    restart: "no"

volumes:
  pgdata:
